<link rel="stylesheet" href="./style.css" />
<script src="./script.js"></script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贪吃蛇</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      touch-action: manipulation;
    }
    h1 { margin: 0 0 10px; }
    #score { font-size: 20px; margin-bottom: 10px; }
    canvas {
      border: 2px solid #333;
      background: #111;
      touch-action: none;
      max-width: 100%;
      height: auto;
    }
    button {
      margin-top: 12px;
      padding: 12px 32px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div>得分：<span id="score">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <button id="restart">重新开始</button>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const GRID = 20, CELL = 20;
    let snake, dir, nextDir, food, score, timer, over, paused;

    function init() {
      snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      over = false;
      paused = false;
      scoreEl.textContent = score;
      spawnFood();
      clearInterval(timer);
      timer = setInterval(tick, 130);
    }

    function spawnFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function tick() {
      if (over || paused) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function gameOver() {
      over = true;
      draw();
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, 400, 400);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '28px sans-serif';
      ctx.fillText('游戏结束', 200, 185);
      ctx.font = '20px sans-serif';
      ctx.fillText('最终分数：' + score, 200, 225);
      ctx.fillText('按空格键或轻点屏幕重新开始', 200, 265);
    }

    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, 400, 400);
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#8bc34a' : '#4caf50';
        ctx.fillRect(s.x * CELL, s.y * CELL, CELL - 2, CELL - 2);
      });
      ctx.fillStyle = '#f44336';
      ctx.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8);
      if (paused && !over) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '28px sans-serif';
        ctx.fillText('已暂停', 200, 200);
      }
    }

    function restart() {
      init();
      draw();
    }

    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === ' ') {
        e.preventDefault();
        restart();
        return;
      }
      if (k === 'p') {
        paused = !paused;
        draw();
        return;
      }
      const dirs = {
        arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
        arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
        arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
      };
      if (dirs[k]) {
        e.preventDefault();
        if (!(dirs[k].x === -dir.x && dirs[k].y === -dir.y)) nextDir = dirs[k];
      }
    });

    // 触屏模式：在画布上滑动控制方向，游戏结束后轻点重新开始
    let touchStart = null;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: false });
    canvas.addEventListener('touchend', e => {
      if (!touchStart) return;
      e.preventDefault();
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
        if (over) restart();
        return;
      }
      const d = Math.abs(dx) > Math.abs(dy)
        ? { x: Math.sign(dx), y: 0 }
        : { x: 0, y: Math.sign(dy) };
      if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
    }, { passive: false });

    document.getElementById('restart').onclick = restart;

    init();
    draw();
  </script>
</body>
</html>
